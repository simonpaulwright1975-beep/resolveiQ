<title>ResolveIQ Customer Care Console</title>
<style>
/* ResolveIQ — customer service console
   Visual language: warm cream ground, terracotta accent, heavy display numerals,
   uppercase micro-labels, monospace for anything numeric. */

:root {
  --bg: #FBF0EC;
  --surface: #FFFFFF;
  --surface-2: #FBF5F2;
  --border: #F1E0DA;
  --border-strong: #E3CCC3;
  --ink: #16110F;
  --ink-2: #4B3C37;
  --muted: #8B7A73;
  --accent: #C1664F;
  --accent-ink: #A4523E;
  --accent-soft: #F5DED6;
  --track: #F3E7E2;
  --good: #4F7C55;
  --good-soft: #E3EFE4;
  --warn: #A9762E;
  --warn-soft: #F7E9D3;
  --bad: #B4463A;
  --bad-soft: #F8DFDA;
  --shadow: 0 1px 2px rgba(60, 30, 20, .05), 0 8px 24px rgba(60, 30, 20, .05);
  --radius: 14px;
  --radius-sm: 9px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17120F;
    --surface: #201915;
    --surface-2: #281F1A;
    --border: #372B25;
    --border-strong: #4B3A32;
    --ink: #F7EFEB;
    --ink-2: #DDCEC7;
    --muted: #A99089;
    --accent: #E08A6E;
    --accent-ink: #F0A98F;
    --accent-soft: #40281F;
    --track: #2F2620;
    --good: #7FB187;
    --good-soft: #23301F;
    --warn: #D6A45C;
    --warn-soft: #33291A;
    --bad: #E08276;
    --bad-soft: #3A211D;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
  }
}

:root[data-theme="dark"] {
  --bg: #17120F;
  --surface: #201915;
  --surface-2: #281F1A;
  --border: #372B25;
  --border-strong: #4B3A32;
  --ink: #F7EFEB;
  --ink-2: #DDCEC7;
  --muted: #A99089;
  --accent: #E08A6E;
  --accent-ink: #F0A98F;
  --accent-soft: #40281F;
  --track: #2F2620;
  --good: #7FB187;
  --good-soft: #23301F;
  --warn: #D6A45C;
  --warn-soft: #33291A;
  --bad: #E08276;
  --bad-soft: #3A211D;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 22px 20px 64px;
}

/* ---------- shared atoms ---------- */

.label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 650;
  white-space: nowrap;
  border: 1px solid transparent;
}

.pill--neutral { background: var(--surface-2); color: var(--ink-2); border-color: var(--border); }
.pill--accent  { background: var(--accent-soft); color: var(--accent-ink); }
.pill--good    { background: var(--good-soft); color: var(--good); }
.pill--warn    { background: var(--warn-soft); color: var(--warn); }
.pill--bad     { background: var(--bad-soft); color: var(--bad); }

button {
  font: inherit;
  cursor: pointer;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink);
  padding: 7px 12px;
  font-weight: 600;
  transition: background .12s ease, border-color .12s ease, transform .06s ease;
}

button:hover { background: var(--surface-2); }
button:active { transform: translateY(1px); }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

button.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- masthead ---------- */

.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}

.brand { display: flex; align-items: center; gap: 11px; }

.brand__mark {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: -.02em;
  flex: none;
}

.brand__name {
  margin: 0;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -.02em;
}

.brand__sub { margin: 1px 0 0; color: var(--muted); font-size: 12.5px; }

.masthead__meta { display: flex; align-items: center; gap: 8px; }

.live {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 650;
  color: var(--muted);
}

.live__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 3px var(--good-soft);
}

/* ---------- KPI row ---------- */

.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 12px;
  margin-bottom: 12px;
}

.kpi { padding: 15px 17px 16px; }

.kpi__value {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -.03em;
  line-height: 1.05;
  margin: 7px 0 5px;
}

.kpi__delta { font-size: 12px; font-weight: 650; }
.kpi__delta--good { color: var(--good); }
.kpi__delta--bad { color: var(--bad); }
.kpi__delta--muted { color: var(--muted); }

/* ---------- mid grid ---------- */

.grid-2 {
  display: grid;
  grid-template-columns: 1.45fr 1fr;
  gap: 12px;
  margin-bottom: 12px;
}

@media (max-width: 880px) {
  .grid-2 { grid-template-columns: 1fr; }
}

.panel { padding: 16px 18px 18px; }

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

/* intent bars */

.bars { display: grid; gap: 11px; }

.bar { display: grid; grid-template-columns: 132px 1fr auto; align-items: center; gap: 12px; }

.bar__name {
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
}

.bar__name span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bar__track {
  height: 9px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}

.bar__fill {
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
  transition: width .4s cubic-bezier(.2, .8, .3, 1);
}

.bar__value { font-size: 12.5px; font-weight: 650; color: var(--ink-2); min-width: 62px; text-align: right; }

@media (max-width: 520px) {
  .bar { grid-template-columns: 108px 1fr auto; gap: 9px; }
}

/* gauge */

.gauge { display: grid; place-items: center; gap: 2px; padding: 4px 0 2px; }

.gauge__ring { position: relative; width: 158px; height: 158px; }
.gauge__ring svg { transform: rotate(-90deg); display: block; }

.gauge__center {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  gap: 2px;
}

.gauge__pct { font-size: 31px; font-weight: 800; letter-spacing: -.03em; }
.gauge__foot { margin-top: 10px; font-size: 13px; color: var(--ink-2); text-align: center; }
.gauge__foot strong { color: var(--accent-ink); }

/* ---------- queue ---------- */

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 13px;
}

.search {
  flex: 1 1 190px;
  min-width: 150px;
  padding: 8px 11px;
  font: inherit;
  color: var(--ink);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}

.search::placeholder { color: var(--muted); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  padding: 6px 11px;
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--ink-2);
}

.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--bg);
}

.table-scroll { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; min-width: 720px; }

thead th {
  text-align: left;
  padding: 0 10px 9px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; }
tbody tr:last-child { border-bottom: 0; }
tbody tr:hover { background: var(--surface-2); }
tbody tr[aria-selected="true"] { background: var(--accent-soft); }

tbody td { padding: 11px 10px; vertical-align: middle; }

.cust { font-weight: 650; }
.cust small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }
.subject { color: var(--ink-2); max-width: 260px; }

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  flex: none;
}

.dot--positive { background: var(--good); }
.dot--neutral { background: var(--muted); }
.dot--frustrated { background: var(--warn); }
.dot--angry { background: var(--bad); }

.sla { font-weight: 650; }
.sla--ok { color: var(--good); }
.sla--soon { color: var(--warn); }
.sla--breach { color: var(--bad); }

.empty { padding: 34px 10px; text-align: center; color: var(--muted); }

/* ---------- detail drawer ---------- */

.scrim {
  position: fixed;
  inset: 0;
  background: rgba(30, 15, 10, .34);
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease;
  z-index: 40;
}

.scrim.open { opacity: 1; pointer-events: auto; }

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  height: 100%;
  width: min(440px, 100%);
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: -18px 0 44px rgba(60, 30, 20, .14);
  transform: translateX(100%);
  transition: transform .22s cubic-bezier(.2, .8, .3, 1);
  z-index: 50;
  display: flex;
  flex-direction: column;
}

.drawer.open { transform: none; }

.drawer__head {
  padding: 16px 18px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.drawer__title { margin: 6px 0 3px; font-size: 17px; font-weight: 750; letter-spacing: -.01em; }
.drawer__body { padding: 16px 18px 22px; overflow-y: auto; flex: 1; }

.icon-btn {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 19px;
  line-height: 1;
  padding: 4px 7px;
}

.section { margin-bottom: 20px; }
.section > .label { display: block; margin-bottom: 9px; }

.msg {
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
}

.msg--agent { background: var(--accent-soft); border-color: transparent; }
.msg__who { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
.msg p { margin: 0; font-size: 13px; color: var(--ink-2); }

.suggestion {
  border: 1px solid var(--accent-soft);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 12px 13px;
}

.suggestion p { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }

.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }

.history li {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12.5px;
  padding-bottom: 7px;
  border-bottom: 1px dashed var(--border);
}

.history li:last-child { border-bottom: 0; padding-bottom: 0; }
.history span { color: var(--muted); font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.facts div { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px; }
.facts b { display: block; font-size: 14px; font-weight: 700; margin-top: 3px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

.footnote {
  margin: 22px 0 0;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}

/* draft output */

.steps { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.steps li { font-size: 12.5px; color: var(--ink-2); }

.draft-error {
  margin: 8px 0 0;
  font-size: 12.5px;
  color: var(--bad);
}

.save-note {
  margin: 8px 0 0;
  font-size: 12.5px;
  color: var(--warn);
}

/* ---------- how-it-works tour ---------- */
/* Uses the console's own tokens so it belongs to the page rather than sitting
   on top of it, and follows the viewer's light/dark setting like everything else. */

.tour-veil {
  position: fixed;
  inset: 0;
  background: rgba(30, 15, 10, .45);
  z-index: 100;
  transition: background .15s ease;
}

/* When a step highlights an element, the spotlight's own shadow does the
   dimming — the veil must step back or the page goes twice as dark. */
.tour-veil.is-clear { background: transparent; }

/* A transparent window with a very large shadow: whatever sits beneath the
   centre stays visible and lit, everything around it dims. */
.tour-spot {
  position: fixed;
  border-radius: 10px;
  box-shadow: 0 0 0 9999px rgba(30, 15, 10, .45), 0 0 0 2px var(--accent);
  background: transparent;
  pointer-events: none;
  z-index: 101;
  transition: top .2s ease, left .2s ease, width .2s ease, height .2s ease, opacity .15s ease;
}

.tour-card {
  position: fixed;
  z-index: 102;
  width: min(360px, calc(100vw - 24px));
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: 0 18px 48px rgba(60, 30, 20, .22);
  padding: 15px 17px 14px;
  transition: top .2s ease, left .2s ease;
}

.tour-card:focus { outline: none; }

.tour-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 9px;
}

.tour-step {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}

.tour-skip {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  padding: 2px 4px;
}

.tour-skip:hover { background: transparent; color: var(--ink); text-decoration: underline; }

.tour-flag {
  display: inline-block;
  margin-bottom: 7px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
}

.tour-title {
  margin: 0 0 8px;
  font-size: 17px;
  font-weight: 750;
  letter-spacing: -.01em;
  line-height: 1.25;
  text-wrap: balance;
}

.tour-do {
  margin: 0 0 8px;
  font-size: 13.5px;
  color: var(--ink);
}

.tour-do strong {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin-right: 5px;
}

.tour-why {
  margin: 0 0 14px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--ink-2);
}

.tour-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}

.tour-nav .primary { margin-left: auto; }
.tour-nav button { padding: 6px 13px; font-size: 13px; }

.tour-dots { display: flex; gap: 4px; align-items: center; margin-right: 4px; }

.tour-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--track);
}

.tour-dot.is-on { background: var(--accent); }

/* first-run nudge */

.tour-nudge {
  position: fixed;
  z-index: 99;
  width: min(320px, calc(100vw - 24px));
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  padding: 12px 34px 12px 14px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--ink-2);
}

.tour-nudge strong { color: var(--ink); }

.tour-nudge__go {
  display: block;
  margin-top: 9px;
  border-color: var(--accent);
  color: var(--accent-ink);
  font-size: 12.5px;
  padding: 5px 11px;
}

.tour-nudge__x {
  position: absolute;
  top: 6px;
  right: 8px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 17px;
  line-height: 1;
  padding: 2px 5px;
}

@media (prefers-reduced-motion: reduce) {
  .tour-card, .tour-spot { transition: none; }
}

</style>

<div class="wrap">

    <header class="masthead">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">R</div>
        <div>
          <h1 class="brand__name">ResolveIQ</h1>
          <p class="brand__sub" id="team-line">Customer Care</p>
        </div>
      </div>
      <div class="masthead__meta">
        <span class="live" id="source-badge"><span class="live__dot"></span> <span id="source-text">CONNECTING</span></span>
        <button id="how-it-works" title="A short walkthrough of how to work the queue">How it works</button>
        <button id="reset" title="Restore the sample queue to its starting state">Reset demo</button>
      </div>
    </header>

    <section class="kpis" id="kpis" aria-label="Today's performance"></section>

    <div class="grid-2">
      <section class="card panel" aria-labelledby="intent-h">
        <div class="panel__head">
          <span class="label" id="intent-h">Open tickets by intent</span>
          <span class="label" id="intent-total"></span>
        </div>
        <div class="bars" id="bars"></div>
      </section>

      <section class="card panel" aria-labelledby="sla-h">
        <div class="panel__head">
          <span class="label" id="sla-h">SLA compliance</span>
        </div>
        <div class="gauge">
          <div class="gauge__ring">
            <svg width="158" height="158" viewBox="0 0 158 158" role="img" aria-labelledby="gauge-desc">
              <title id="gauge-desc">Share of open tickets still inside their SLA window</title>
              <circle cx="79" cy="79" r="66" fill="none" stroke="var(--track)" stroke-width="15"></circle>
              <circle id="gauge-arc" cx="79" cy="79" r="66" fill="none" stroke="var(--accent)"
                      stroke-width="15" stroke-linecap="round" stroke-dasharray="0 999"></circle>
            </svg>
            <div class="gauge__center">
              <div class="gauge__pct num" id="gauge-pct">—</div>
              <div class="label">within SLA</div>
            </div>
          </div>
          <p class="gauge__foot" id="gauge-foot"></p>
        </div>
      </section>
    </div>

    <section class="card panel" aria-labelledby="queue-h">
      <div class="panel__head">
        <span class="label" id="queue-h">Live queue</span>
        <span class="label" id="queue-count"></span>
      </div>

      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Search customer, subject or ticket ID"
               aria-label="Search the queue">
        <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
      </div>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">Ticket</th>
              <th scope="col">Customer</th>
              <th scope="col">Subject</th>
              <th scope="col">Intent</th>
              <th scope="col">Channel</th>
              <th scope="col">Waiting</th>
              <th scope="col">SLA</th>
              <th scope="col">Owner</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="empty" id="empty" hidden>Nothing matches that filter.</p>
    </section>

    <p class="footnote" id="footnote">Loading queue…</p>
  </div>

  <div class="scrim" id="scrim"></div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="drawer__head">
      <div>
        <span class="label" id="drawer-id"></span>
        <h2 class="drawer__title" id="drawer-title"></h2>
        <div id="drawer-pills" class="chips"></div>
      </div>
      <button class="icon-btn" id="drawer-close" aria-label="Close ticket details">&times;</button>
    </div>
    <div class="drawer__body" id="drawer-body"></div>

<script>
/* Queue loader.

   Tries the server first (/api/tickets, which reads Sage CRM), and falls back
   to the bundled sample so the page still works when opened straight from
   disk with no server running. */

window.RESOLVEIQ_LOAD = async function loadQueue() {
  try {
    const response = await fetch('/api/tickets', { headers: { Accept: 'application/json' } });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    if (!Array.isArray(data.tickets)) throw new Error('unexpected payload');
    return data;
  } catch (error) {
    console.warn('Queue API unavailable, using sample data:', error.message);
    return Object.assign({}, window.RESOLVEIQ_DATA, {
      source: 'sample',
      reason: 'Sample data — start the server and connect Sage CRM to show your live queue.'
    });
  }
};

<script>
/* ResolveIQ console.
   Vanilla JS, no build step. State lives in memory; the agent's own changes
   (claim / resolve / snooze) are mirrored into localStorage so a refresh
   doesn't lose them. */

(function () {
  'use strict';

  var DATA = null;              // resolved by init() from /api/tickets
  var STORE_KEY = 'resolveiq.overrides.v1';
  var ME = 'You';

  var state = {
    status: 'active',       // active | new | open | pending | resolved | all
    query: '',
    selected: null,
    tickets: [],
    drafting: false,        // a /api/suggest call is in flight
    draftError: null,
    saving: false,          // a /api/cases call is in flight
    saveError: null,
    saveNote: null          // e.g. saved but not linked to a customer
  };

  /* ---------- persistence (best effort — private mode, blocked storage) ---------- */

  function loadOverrides() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
    } catch (e) {
      return {};
    }
  }

  function saveOverrides() {
    var out = {};
    state.tickets.forEach(function (t) {
      if (t._touched) out[t.id] = { status: t.status, assignee: t.assignee, waitMins: t.waitMins };
    });
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(out));
    } catch (e) { /* nothing to do — the session just won't survive a refresh */ }
  }

  function hydrate() {
    var saved = loadOverrides();
    state.tickets = DATA.tickets.map(function (t) {
      var copy = Object.assign({}, t);
      if (saved[t.id]) {
        Object.assign(copy, saved[t.id]);
        copy._touched = true;
      }
      return copy;
    });
  }

  /* ---------- helpers ---------- */

  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function isOpen(t) { return t.status !== 'resolved'; }

  /* An SLA is breached once the customer has waited longer than the window. */
  function slaState(t) {
    if (!isOpen(t)) return 'ok';
    var used = t.waitMins / t.slaMins;
    if (used >= 1) return 'breach';
    if (used >= 0.7) return 'soon';
    return 'ok';
  }

  function slaLabel(t) {
    if (!isOpen(t)) return 'met';
    var left = t.slaMins - t.waitMins;
    return left <= 0 ? 'breached' : left + 'm left';
  }

  function mins(n) { return n < 60 ? n + 'm' : Math.floor(n / 60) + 'h ' + (n % 60) + 'm'; }

  function money(n) {
    return '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /* ---------- KPI row ---------- */

  function renderKpis() {
    var m = DATA.metrics || {};
    var open = state.tickets.filter(isOpen);
    var breaching = open.filter(function (t) { return slaState(t) !== 'ok'; }).length;

    var has = function (v) { return v !== null && v !== undefined && !isNaN(v); };

    /* A delta needs both halves. Missing either means we say nothing rather
       than inventing a comparison. */
    var delta = function (now, before, unit, higherIsBetter) {
      if (!has(now) || !has(before)) return { text: 'not tracked in Sage CRM', tone: 'muted' };
      var d = now - before;
      var better = higherIsBetter ? d >= 0 : d <= 0;
      return {
        text: (d >= 0 ? '↑ +' : '↓ ') + Math.abs(d).toFixed(unit === 'pts' ? 0 : 1) +
              (unit ? ' ' + unit : ''),
        tone: better ? 'good' : 'bad'
      };
    };

    var show = function (v, suffix, decimals) {
      return has(v) ? Number(v).toFixed(decimals || 0) + (suffix || '') : '—';
    };

    var cards = [
      {
        label: 'Open tickets',
        value: open.length,
        delta: breaching + ' need attention',
        tone: breaching ? 'bad' : 'good'
      },
      {
        label: 'Resolved today',
        value: show(m.resolvedToday),
        delta: (function (d) { return d.tone === 'muted' ? 'from open cases' : d.text + ' vs yesterday'; })(
          delta(m.resolvedToday, m.resolvedYesterday, '', true)),
        tone: delta(m.resolvedToday, m.resolvedYesterday, '', true).tone
      },
      {
        label: 'Auto-resolved',
        value: show(m.autoResolvedPct, '%'),
        delta: delta(m.autoResolvedPct, m.autoResolvedPrevPct, 'pts', true).text,
        tone: delta(m.autoResolvedPct, m.autoResolvedPrevPct, 'pts', true).tone
      },
      {
        label: 'Avg handling time',
        value: show(m.avgHandleMins, 'm', 1),
        delta: delta(m.avgHandleMins, m.prevHandleMins, 'm', false).text,
        tone: delta(m.avgHandleMins, m.prevHandleMins, 'm', false).tone
      },
      {
        label: 'CSAT',
        value: show(m.csat, '', 1),
        delta: delta(m.csat, m.prevCsat, '', true).text,
        tone: delta(m.csat, m.prevCsat, '', true).tone
      }
    ];

    $('kpis').innerHTML = cards.map(function (c) {
      return '<div class="card kpi">' +
        '<div class="label">' + esc(c.label) + '</div>' +
        '<div class="kpi__value num">' + esc(c.value) + '</div>' +
        '<div class="kpi__delta kpi__delta--' + c.tone + '">' + esc(c.delta) + '</div>' +
        '</div>';
    }).join('');
  }

  /* ---------- intent bars ---------- */

  function renderBars() {
    var open = state.tickets.filter(isOpen);
    var counts = {};
    open.forEach(function (t) { counts[t.intent] = (counts[t.intent] || 0) + 1; });

    var rows = Object.keys(counts).map(function (k) {
      return { name: k, n: counts[k] };
    }).sort(function (a, b) { return b.n - a.n; });

    var max = rows.reduce(function (m, r) { return Math.max(m, r.n); }, 1);
    $('intent-total').textContent = open.length + ' open';

    if (!rows.length) {
      $('bars').innerHTML = '<p class="empty">Queue is clear. Nice work.</p>';
      return;
    }

    $('bars').innerHTML = rows.map(function (r) {
      var pct = Math.round((r.n / max) * 100);
      var share = Math.round((r.n / open.length) * 100);
      return '<div class="bar">' +
        '<div class="bar__name"><span>' + esc(r.name) + '</span></div>' +
        '<div class="bar__track"><div class="bar__fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar__value num">' + r.n + ' · ' + share + '%</div>' +
        '</div>';
    }).join('');
  }

  /* ---------- SLA gauge ---------- */

  function renderGauge() {
    var open = state.tickets.filter(isOpen);
    var within = open.filter(function (t) { return slaState(t) !== 'breach'; }).length;
    var pct = open.length ? Math.round((within / open.length) * 100) : 100;

    var r = 66;
    var circumference = 2 * Math.PI * r;
    var arc = $('gauge-arc');
    arc.setAttribute('stroke-dasharray', (circumference * pct / 100).toFixed(1) + ' ' + circumference.toFixed(1));
    var target = (DATA.metrics && DATA.metrics.slaTargetPct) || 95;
    arc.setAttribute('stroke', pct >= target ? 'var(--good)' : 'var(--accent)');

    $('gauge-pct').textContent = pct + '%';
    $('gauge-foot').innerHTML = '<strong>' + within + '</strong> of ' + open.length +
      ' open tickets inside target · goal ' + target + '%';
  }

  /* ---------- queue table ---------- */

  var FILTERS = [
    { key: 'active', text: 'Active' },
    { key: 'new', text: 'New' },
    { key: 'open', text: 'Open' },
    { key: 'pending', text: 'Pending' },
    { key: 'resolved', text: 'Resolved' },
    { key: 'all', text: 'All' }
  ];

  function renderChips() {
    $('chips').innerHTML = FILTERS.map(function (f) {
      return '<button class="chip" data-status="' + f.key + '" aria-pressed="' +
        (state.status === f.key) + '">' + esc(f.text) + '</button>';
    }).join('');
  }

  function visibleTickets() {
    var q = state.query.trim().toLowerCase();
    return state.tickets.filter(function (t) {
      var statusOk =
        state.status === 'all' ? true :
        state.status === 'active' ? isOpen(t) :
        t.status === state.status;
      if (!statusOk) return false;
      if (!q) return true;
      return (t.customer + ' ' + t.subject + ' ' + t.id + ' ' + t.intent + ' ' + t.account)
        .toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) {
      /* Most urgent first: breaching before at-risk, then longest wait. */
      var rank = { breach: 0, soon: 1, ok: 2 };
      var d = rank[slaState(a)] - rank[slaState(b)];
      if (d) return d;
      return b.waitMins - a.waitMins;
    });
  }

  function renderRows() {
    var list = visibleTickets();
    $('queue-count').textContent = list.length + (list.length === 1 ? ' ticket' : ' tickets');
    $('empty').hidden = list.length > 0;

    $('rows').innerHTML = list.map(function (t) {
      var st = slaState(t);
      return '<tr data-id="' + t.id + '" tabindex="0" aria-selected="' + (state.selected === t.id) + '">' +
        '<td class="num">' + esc(t.id) + '</td>' +
        '<td class="cust">' + esc(t.customer) + '<small>' + esc(t.account) + '</small></td>' +
        '<td class="subject">' + esc(t.subject) + '</td>' +
        '<td><span class="pill pill--neutral"><span class="dot dot--' + t.sentiment + '"></span>' +
          esc(t.intent) + '</span></td>' +
        '<td>' + esc(t.channel) + '</td>' +
        '<td class="num">' + (isOpen(t) ? mins(t.waitMins) : '—') + '</td>' +
        '<td class="sla sla--' + st + '">' + esc(slaLabel(t)) + '</td>' +
        '<td>' + (t.assignee ? esc(t.assignee) : '<span class="pill pill--accent">Unassigned</span>') + '</td>' +
        '</tr>';
    }).join('');
  }

  /* ---------- writing to the customer record ---------- */

  /* Returns { ok, warning } or { ok: false, error }. Never throws — the caller
     decides what to do about a failure, and a failure must never be silent. */
  async function saveCase(ticket, overrides) {
    var payload = {
      ticket: Object.assign({}, ticket, overrides || {}),
      agent: ME,
      resolution: ticket.aiSuggestion || null
    };

    try {
      var response = await fetch('/api/cases', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var body = await response.json().catch(function () { return {}; });
      if (!response.ok) {
        return { ok: false, error: body.error || ('Could not save — HTTP ' + response.status) };
      }
      return { ok: true, warning: body.warning || null };
    } catch (error) {
      return { ok: false, error: 'Could not save to the customer record — ' + error.message };
    }
  }

  /* ---------- suggested resolution ---------- */

  function suggestionHtml(t) {
    if (state.drafting) {
      return '<div class="suggestion"><p>Reading the case and drafting a reply…</p></div>';
    }

    var error = state.draftError
      ? '<p class="draft-error">' + esc(state.draftError) + '</p>'
      : '';

    if (!t.aiSuggestion) {
      return '<div class="suggestion">' +
        '<p>No draft yet.</p>' + error +
        '<div class="actions"><button data-act="draft">Draft a reply</button></div>' +
        '</div>';
    }

    var confidence = t.aiConfidence == null ? null : Math.round(t.aiConfidence * 100);
    var steps = (t.nextSteps || []).map(function (n) {
      return '<li>' + esc(n) + '</li>';
    }).join('');

    return '<div class="suggestion">' +
      (confidence == null ? '' : '<span class="pill pill--accent">' + confidence + '% confidence</span>') +
      (t.escalate ? ' <span class="pill pill--bad">Escalate</span>' : '') +
      (t.aiSummary ? '<p><strong>' + esc(t.aiSummary) + '</strong></p>' : '') +
      '<p>' + esc(t.aiSuggestion).replace(/\n/g, '<br>') + '</p>' +
      (steps ? '<span class="label">Next steps</span><ul class="steps">' + steps + '</ul>' : '') +
      (t.escalate && t.escalationReason
        ? '<p class="draft-error">' + esc(t.escalationReason) + '</p>' : '') +
      error +
      '<div class="actions"><button data-act="draft">Redraft</button></div>' +
      '</div>';
  }

  async function draft() {
    var t = state.tickets.filter(function (x) { return x.id === state.selected; })[0];
    if (!t || state.drafting) return;

    state.drafting = true;
    state.draftError = null;
    openDrawer(t.id);

    try {
      var response = await fetch('/api/suggest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ticket: t })
      });
      var body = await response.json();
      if (!response.ok) throw new Error(body.error || ('HTTP ' + response.status));

      t.aiSuggestion = body.reply;
      t.aiSummary = body.summary;
      t.aiConfidence = body.confidence;
      t.nextSteps = body.nextSteps;
      t.escalate = body.escalate;
      t.escalationReason = body.escalationReason;
      /* The model's read of intent and tone beats the keyword guess. */
      if (body.intent) t.intent = body.intent;
      if (body.sentiment) t.sentiment = body.sentiment;
    } catch (error) {
      state.draftError = error.message;
    } finally {
      state.drafting = false;
      renderAll();
      openDrawer(t.id);
    }
  }

  /* ---------- drawer ---------- */

  var lastFocused = null;

  function openDrawer(id) {
    var t = state.tickets.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    state.selected = id;
    lastFocused = document.activeElement;

    $('drawer-id').textContent = t.id + ' · ' + t.channel;
    $('drawer-title').textContent = t.subject;
    $('drawer-pills').innerHTML =
      '<span class="pill pill--neutral"><span class="dot dot--' + t.sentiment + '"></span>' +
        esc(t.sentiment) + '</span>' +
      '<span class="pill pill--neutral">' + esc(t.intent) + '</span>' +
      '<span class="pill pill--' + (slaState(t) === 'breach' ? 'bad' : slaState(t) === 'soon' ? 'warn' : 'good') +
        '">' + esc(slaLabel(t)) + '</span>';

    $('drawer-body').innerHTML =
      '<div class="section">' +
        '<div class="facts">' +
          '<div><span class="label">Customer</span><b>' + esc(t.customer) + '</b></div>' +
          '<div><span class="label">Account</span><b>' + esc(t.account) + '</b></div>' +
          '<div><span class="label">Waiting</span><b class="num">' + (isOpen(t) ? mins(t.waitMins) : 'Resolved') + '</b></div>' +
          '<div><span class="label">Order value</span><b class="num">' + (t.value ? money(t.value) : '—') + '</b></div>' +
        '</div>' +
      '</div>' +

      '<div class="section">' +
        '<span class="label">Conversation</span>' +
        t.messages.map(function (m) {
          return '<div class="msg' + (m.agent ? ' msg--agent' : '') + '">' +
            '<div class="msg__who">' + esc(m.who) + ' · ' + esc(m.at) + '</div>' +
            '<p>' + esc(m.text) + '</p></div>';
        }).join('') +
      '</div>' +

      '<div class="section">' +
        '<span class="label">Suggested resolution</span>' +
        suggestionHtml(t) +
      '</div>' +

      '<div class="section">' +
        '<span class="label">Previous contact' + (t.history.length ? '' : ' — none') + '</span>' +
        (t.history.length
          ? '<ul class="history">' + t.history.map(function (h) {
              return '<li>' + esc(h.text) + '<span>' + esc(h.at) + '</span></li>';
            }).join('') + '</ul>'
          : '<p class="msg"><em>First time this customer has contacted us.</em></p>') +
      '</div>' +

      (state.saveError
        ? '<p class="draft-error">' + esc(state.saveError) + '</p>' +
          '<p class="draft-error">The case has NOT been resolved. Try again, or tell whoever runs the app.</p>'
        : '') +
      (state.saveNote ? '<p class="save-note">' + esc(state.saveNote) + '</p>' : '') +

      '<div class="actions actions--case">' +
        (state.saving
          ? '<button class="primary" disabled>Saving to the customer record…</button>'
          : isOpen(t)
          ? '<button class="primary" data-act="resolve">Send reply &amp; resolve</button>' +
            (t.assignee === ME ? '' : '<button data-act="claim">Assign to me</button>') +
            (t.status === 'pending' ? '' : '<button data-act="pending">Move to pending</button>')
          : '<button data-act="reopen">Reopen ticket</button>') +
      '</div>';

    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('scrim').classList.add('open');
    $('drawer-close').focus();
    renderRows();
  }

  function closeDrawer() {
    state.selected = null;
    $('drawer').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
    $('scrim').classList.remove('open');
    renderRows();
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  async function act(kind) {
    var t = state.tickets.filter(function (x) { return x.id === state.selected; })[0];
    if (!t || state.saving) return;

    if (kind === 'resolve') {
      /* Write to the customer record FIRST. If it doesn't save there, the
         case is not resolved — showing it as done when nothing was recorded
         is the one failure this app exists to prevent. */
      state.saving = true;
      state.saveError = null;
      state.saveNote = null;
      openDrawer(t.id);

      var outcome = await saveCase(t, { status: 'resolved' });
      state.saving = false;

      if (!outcome.ok) {
        state.saveError = outcome.error;
        openDrawer(t.id);
        return;
      }

      state.saveNote = outcome.warning || null;
      t.status = 'resolved';
      t.waitMins = 0;
      if (!t.assignee) t.assignee = ME;
      DATA.metrics.resolvedToday += 1;
    } else if (kind === 'claim') {
      t.assignee = ME;
      if (t.status === 'new') t.status = 'open';
    } else if (kind === 'pending') {
      t.status = 'pending';
      if (!t.assignee) t.assignee = ME;
    } else if (kind === 'reopen') {
      t.status = 'open';
      t.waitMins = 1;
      DATA.metrics.resolvedToday = Math.max(0, DATA.metrics.resolvedToday - 1);
    }

    t._touched = true;
    saveOverrides();
    renderAll();

    if (kind === 'resolve') closeDrawer();
    else openDrawer(t.id);
  }

  /* ---------- wiring ---------- */

  function renderSource() {
    var source = DATA.source || 'sample';
    var text = source === 'sage' ? 'SAGE CRM · LIVE'
      : source === 'sage-stale' ? 'SAGE CRM · STALE'
      : 'SAMPLE DATA';
    $('source-text').textContent = text;
    $('source-badge').querySelector('.live__dot').style.background =
      source === 'sage' ? 'var(--good)' : source === 'sage-stale' ? 'var(--warn)' : 'var(--muted)';

    $('footnote').textContent = DATA.reason
      ? DATA.reason
      : 'Live from Sage CRM. Drafts are generated on request and are not sent until you send them.';
  }

  function renderAll() {
    renderKpis();
    renderBars();
    renderGauge();
    renderChips();
    renderRows();
  }

  async function init() {
    DATA = await window.RESOLVEIQ_LOAD();
    ME = DATA.currentAgent || 'You';
    $('team-line').textContent = DATA.team || 'Customer Care';
    renderSource();
    hydrate();
    renderAll();

    $('search').addEventListener('input', function (e) {
      state.query = e.target.value;
      renderRows();
    });

    $('chips').addEventListener('click', function (e) {
      var btn = e.target.closest('.chip');
      if (!btn) return;
      state.status = btn.dataset.status;
      renderChips();
      renderRows();
    });

    $('rows').addEventListener('click', function (e) {
      var tr = e.target.closest('tr');
      if (tr) openDrawer(tr.dataset.id);
    });

    $('rows').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var tr = e.target.closest('tr');
      if (tr) { e.preventDefault(); openDrawer(tr.dataset.id); }
    });

    $('drawer-body').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      if (btn.dataset.act === 'draft') draft();
      else act(btn.dataset.act);
    });

    $('drawer-close').addEventListener('click', closeDrawer);
    $('scrim').addEventListener('click', closeDrawer);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && state.selected) closeDrawer();
    });

    /* The tour drives the app through these rather than faking clicks. */
    window.RESOLVEIQ_APP = {
      openFirstTicket: function () {
        if (state.selected) return;
        var first = visibleTickets()[0];
        if (first) openDrawer(first.id);
      },
      closeDrawer: function () { if (state.selected) closeDrawer(); }
    };

    $('reset').addEventListener('click', function () {
      try { localStorage.removeItem(STORE_KEY); } catch (err) { /* ignore */ }
      hydrate();
      renderAll();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
